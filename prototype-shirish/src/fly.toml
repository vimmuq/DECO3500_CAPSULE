# fly.toml app configuration file generated for deco3500-capsule on 2026-10-19T11:17:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'deco3500-capsule'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[[mounts]]
  source = 'capsule_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
